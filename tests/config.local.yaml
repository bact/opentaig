# Example config for building against local CSV fixtures instead of fetching
# from Google Sheets -- handy for offline development, and used by CI-less
# local verification of build.py. Run from the repo root:
#
#   python build.py --config tests/config.local.yaml
#
site:
  title: "OpenTAIG"
  tagline: "Open Problems in Technical AI Governance"
  description: >
    A community-maintained catalog of open technical problems in AI
    governance, mapped to relevant principles/regulations and linked to
    open-source tools that help address them.
  base_path: ""
  repo_url: "https://github.com/bact/opentaig"
  source_paper_url: "https://arxiv.org/abs/2407.14981"
  taig_database_url: "https://taig.stanford.edu/taig_database.html"

output_dir: "site"

data:
  taig:
    sheet_id: "unused-when-file-is-set"
    gid: 0
    file: "tests/fixtures/taig.csv"
  mapping:
    sheet_id: "unused-when-file-is-set"
    gid: 0
    file: "tests/fixtures/mapping.csv"
  tools:
    sheet_id: "unused-when-file-is-set"
    gid: 1
    file: "tests/fixtures/tools.csv"
  terms:
    sheet_id: "unused-when-file-is-set"
    gid: 2
    file: "tests/fixtures/terms.csv"
  framework:
    sheet_id: "unused-when-file-is-set"
    gid: 3
    file: "tests/fixtures/framework.csv"

columns:
  taig:
    question: "Research Question"
    question_number: "Question number (in paper)"
    section_number: "Section Number"
    target: "Target(s)"
    capacity: "Capacity"
    problem_area: "Problem Area (from Problem Areas)"
    existing_work: "Existing work & resources"
    relevant_expertise: "Relevant expertise"
    new_work: "New work (since publication)"
  mapping:
    rq_no: "RQ_No"
    tools_implement: "tools_implement"
    tools_eval: "tools_eval"
  tools:
    id: "id"
    tool_type: "tool_type"
    name: "name"
    summary: "summary"
    license: "license"
    homepage: "homepage"
    source: "source"
    documentation: "documentation"
    funding: "funding"
    implement: "implement"
    eval: "eval"
  terms:
    id: "id"
    framework: "framework_id"
    name: "name"
    summary: "summary"
    url: "url"
  framework:
    id: "id"
    name: "name"
    fullname: "fullname"
    summary: "summary"
    homepage: "homepage"
    source: "source"
    group: "group"

frameworks:
  - key: rgaf
    column: "RGAF"
  - key: euaiact
    column: "EUAIAct"
  - key: unescoai
    column: "UNESCOAI"
  - key: aseanai
    column: "ASEANAI"
  - key: coeai
    column: "CoEAI"

expertise:
  key: expertise
  label: "Relevant Expertise"

taxonomy:
  capacities:
    - "Assessment"
    - "Access"
    - "Verification"
    - "Security"
    - "Operationalisation"
    - "Ecosystem Monitoring"
  targets:
    - "Data"
    - "Compute"
    - "Model & Algorithms"
    - "Deployment"
    - "All"
  uncategorized_label: "Uncategorized"
