# Example config for building against local CSV fixtures instead of fetching
# from Google Sheets -- handy for offline development, and used by CI-less
# local verification of build.py. Run from the repo root:
#
#   python build.py --config tests/config.local.yaml
#
site:
  title: "OpenTAIG"
  tagline: "Open source tools for technical AI governance"
  description: >
    A catalog of open-source tools mapped to open problems in technical AI
    governance (Reuel, Bucknall, et al., 2025) and linked to relevant
    principles and regulations.
  base_path: ""
  repo_url: "https://github.com/bact/opentaig"
  source_paper_url: "https://arxiv.org/abs/2407.14981"
  taig_database_url: "https://taig.stanford.edu/taig_database.html"

output_dir: "site"

data:
  taig:
    sheet_id: "unused-when-file-is-set"
    gid: 0
    file: "tests/fixtures/taig.csv"
  mapping:
    sheet_id: "unused-when-file-is-set"
    gid: 0
    file: "tests/fixtures/mapping.csv"
  tool_map:
    sheet_id: "unused-when-file-is-set"
    gid: 0
    file: "tests/fixtures/tool_map.csv"
  tools:
    sheet_id: "unused-when-file-is-set"
    gid: 1
    file: "tests/fixtures/tools.csv"
  tool_metadata:
    sheet_id: "unused-when-file-is-set"
    gid: 4
    file: "tests/fixtures/tool_metadata.csv"
  terms:
    sheet_id: "unused-when-file-is-set"
    gid: 2
    file: "tests/fixtures/terms.csv"
  framework:
    sheet_id: "unused-when-file-is-set"
    gid: 3
    file: "tests/fixtures/framework.csv"

columns:
  taig:
    question: "Research Question"
    question_number: "Question number (in paper)"
    section_number: "Section Number"
    target: "Target(s)"
    capacity: "Capacity"
    problem_area: "Problem Area (from Problem Areas)"
    existing_work: "Existing work & resources"
    relevant_expertise: "Relevant expertise"
    new_work: "New work (since publication)"
  mapping:
    rq_no: "rq_no"
    datetime_added: "datetime_added"
    datetime_checked: "datetime_checked"
