# Fallback vocabulary for framework/regulation mapping cells.
#
# The PRIMARY way to separate multiple values in a mapping cell is a
# semicolon `;` (e.g. "Robust, Reliable & Safe; Transparent & Explainable").
# That is unambiguous and needs no vocabulary lookup.
#
# This file exists only as a FALLBACK for cells that still use commas as a
# separator (legacy data, or a stray comma from a paste). Many canonical
# terms themselves contain commas -- e.g. "Article 15 (Accuracy, robustness
# and cybersecurity)" -- so naive comma-splitting silently corrupts them.
# When build.py encounters a comma-separated cell, it greedily matches the
# longest known term from the relevant list below before falling back to a
# plain comma-split (with a build warning either way, so sheet issues
# surface instead of failing silently).
#
# Lists are best-effort, derived from values observed in the sheet plus (for
# RGAF and UNESCO) the source frameworks' published dimensions/principles.
# Extend freely -- an unmatched term just triggers a build warning, it never
# breaks the build.

rgaf:
  - "Robust, Reliable & Safe"
  - "Transparent & Explainable"
  - "Accessible & Inclusive"
  - "Ethical & Fair (unbiased)"
  - "Accountable & Rectifiable"
  - "Compliant & Controllable"
  - "Private & Secure"
  - "Human-Centred & Aligned"
  - "Environmental Sustainability"

eu_ai_act:
  - "Article 8 (Transparency and oversight)"
  - "Article 9 (Accountability and responsibility)"
  - "Article 10 (Data and data governance)"
  - "Article 11 (Technical documentation)"
  - "Article 12 (Record-keeping)"
  - "Article 13 (Transparency)"
  - "Article 14 (Human oversight)"
  - "Article 15 (Accuracy, robustness and cybersecurity)"

unesco:
  - "Proportionality and Do No Harm"
  - "Safety and security"
  - "Right to Privacy and Data Protection"
  - "Multi-stakeholder and adaptive governance"
  - "Responsibility and accountability"
  - "Transparency and explainability"
  - "Human oversight and determination"
  - "Sustainability"
  - "Awareness and literacy"
  - "Fairness and non-discrimination"

asean:
  - "Transparency and Explainability"
  - "Fairness and Equity"
  - "Reliability and Safety"
  - "Accountability and Responsibility"
  - "Privacy and Data Governance"
  - "Responsible Stewardship"
  - "Human-centricity"

coe:
  - "Article 8 (Transparency and oversight)"
  - "Article 9 (Accountability and responsibility)"
  - "Article 10 (Equality and non-discrimination)"
  - "Article 11 (Privacy and personal data protection)"
  - "Article 12 (Reliability)"
  - "Article 13 (Safe innovation)"
