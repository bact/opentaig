name: Build and deploy site

on:
  workflow_dispatch: {}
  schedule:
    # 03:00 UTC on the 1st of every 2nd month (Jan, Mar, May, Jul, Sep, Nov).
    - cron: "0 3 1 1,3,5,7,9,11 *"
  push:
    branches:
      - main

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python build.py

      # Deploys by force-pushing the built site to the gh-pages branch,
      # bypassing the GitHub Actions Pages-deployment API (actions/deploy-pages)
      # entirely -- switch back once that API's stuck-deployment issue clears.
      - name: Deploy to gh-pages branch
        working-directory: site
        run: |
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy site: ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
