# OpenTAIG site configuration.
#
# This file controls where the build pulls data from and how it is labeled.
# Column names below must match the header row of the corresponding Google
# Sheet tab exactly (case-sensitive). If you rename a header in a sheet,
# update the matching entry here -- no code changes needed.

site:
  title: "OpenTAIG"
  tagline: "Open source tools for the open problems in technical AI governance"
  description: >
    A catalog of open-source tools mapped to open problems in technical AI
    governance and linked to relevant principles and regulations.
  # If served from a GitHub Pages project site (https://<user>.github.io/<repo>/),
  # set this to "/<repo>" so internal links resolve correctly. Leave "" for a
  # user/org root site (https://<user>.github.io/) or a custom domain.
  base_path: ""
  repo_url: "https://github.com/bact/opentaig"
  taig_database_url: "https://taig.stanford.edu/taig_database.html"

output_dir: "site"

# --- Data sources -----------------------------------------------------------
# The site is generated from THREE decoupled Google Sheets, joined by
# research question number (rq_no) or tool id:
#
#   1. "taig"     -- the upstream TAIG paper data (question text + taxonomy +
#                   citations + expertise). Manually kept in sync with the
#                   Stanford TAIG database. This is the spine of the site.
#   2. "mapping"  -- OUR framework/regulation mappings, keyed by rq_no. Cells
#                   hold semicolon-separated term ids referencing the "terms"
#                   catalog below, not free text. Lives in a separate sheet
#                   so our editorial work is decoupled from the upstream
#                   source. Does NOT carry tool ids -- see "tool_map" below.
#   3. "tool_map" -- OUR research-question-to-tool mappings, one row per
#                   (rq_no, tool_id, role) triple, plus a free-text rationale
#                   explaining why that tool addresses that specific
#                   question. Long/tidy format rather than a semicolon list
#                   so it's easy to append a new pairing without
#                   hand-editing an existing cell, and so the rationale has
#                   somewhere to live. A tool answering multiple RQs, or an
#                   RQ answered by multiple tools, is just multiple rows --
#                   not a special case.
#   4. "tools"    -- OUR open-source tool catalog (a tab in the OpenTAIG
#                   sheet), referenced by id from the tool_map tab's
#                   tool_id column. Identity fields, plus an optional human
#                   override for every field also in "tool_metadata" below
#                   -- see the `tools:` columns block further down for the
#                   precedence rule.
#   5. "tool_metadata" -- auto-collected project-quality/community-health
#                   data per tool, keyed by id -- a SEPARATE spreadsheet
#                   from OpenTAIG (deliberately, so a future write-
#                   automation credential can be scoped to touch only this
#                   one), 100% written by
#                   curation/collect_project_metadata.py, never hand-edited.
#   6. "terms"    -- OUR RGAF/EUAIAct/UNESCOAI/ASEANAI/CoEAI/AIAAIC term catalog
#                   (a tab in the OpenTAIG sheet), one shared tab across all
#                   frameworks listed in `frameworks:` below, referenced by id
#                   from the mapping tab's framework columns.
#   7. "framework" -- OUR descriptive metadata about each framework/
#                   regulation/recommendation itself (name, homepage, source
#                   document, publishing body), one row per framework key.
#
# The OpenTAIG sheet's tabs are literally named "map", "tool_map", "tools",
# "terms", "framework". (Any "tools_*_seed" tab, e.g. "tools_rgaf_seed", is a
# curation-only seed/staging tab -- the build reads only "tools".)
# "tool_metadata" lives in its own spreadsheet, with its own tab literally
# named "tool_metadata".
#
# Each sheet must be shared as "Anyone with the link" (Viewer) so the CSV
# export endpoint works without credentials. Each source below is looked up
# by `sheet_name` (the tab's visible name, exactly as shown on the tab) --
# preferred over the older `gid` (a tab's opaque numeric id) because a wrong
# gid produces a bare "400 Bad Request" with no clue why, whereas a wrong
# sheet_name is easy to spot and fix. `gid` still works as a fallback if
# `sheet_name` is omitted.
#
# For local development you can bypass the network fetch entirely by setting
# `file:` to a local CSV path (used instead of the sheet when present).
data:
  taig:
    sheet_id: "1uLYmyC9wBSssO5l5dSf6gYv_2-WoMPBR15q0r2kKsyA"
    sheet_name: "Grid view"
    file: null
  mapping:
    sheet_id: "1netgfFKee13Z3_i-ructJkgg08HAPlBKgF-a35bs_ks"
    sheet_name: "map"
    file: null
  tool_map:
    sheet_id: "1netgfFKee13Z3_i-ructJkgg08HAPlBKgF-a35bs_ks"
    sheet_name: "tool_map"
    file: null
  tools:
    sheet_id: "1netgfFKee13Z3_i-ructJkgg08HAPlBKgF-a35bs_ks"
    sheet_name: "tools"
    file: null
  # A SEPARATE spreadsheet, deliberately -- not another tab in the OpenTAIG
  # sheet above. `tool_metadata` is 100% machine-written by
  # curation/collect_project_metadata.py and safe to bulk-overwrite on every
  # collection run; keeping it in its own file means a future automation
  # credential can be granted write access to only this spreadsheet, never
  # the hand-curated `tools`/`tool_map`/`map` tabs. See "tools /
  # tool_metadata precedence" in build.py and docs/data-schema.md.
  tool_metadata:
    sheet_id: "1A3lTBGtMp8yCmW0ziFMdNG9ezGHsnKKd-oFZDjL7IHI"
    sheet_name: "tool_metadata"
    file: null
  terms:
    sheet_id: "1netgfFKee13Z3_i-ructJkgg08HAPlBKgF-a35bs_ks"
    sheet_name: "terms"
    file: null
  framework:
    sheet_id: "1netgfFKee13Z3_i-ructJkgg08HAPlBKgF-a35bs_ks"
    sheet_name: "framework"
    file: null

# --- Column mapping ----------------------------------------------------------
columns:
  # Upstream TAIG sheet (the spine). `question_number` is the join key.
  taig:
    question: "Research Question"
    question_number: "Question number (in paper)"
    section_number: "Section Number"
    target: "Target(s)"
    capacity: "Capacity"
    problem_area: "Problem Area (from Problem Areas)"
    existing_work: "Existing work & resources"
    relevant_expertise: "Relevant expertise"
    new_work: "New work (since publication)"
  # Our mapping tab. `rq_no` joins to taig.question_number. The mapping tab's
  # own "Research_Question" column is a human data-entry aid and is IGNORED by
  # the build -- question text always comes from the TAIG sheet. The
  # framework columns (RGAF/EUAIAct/UNESCOAI/ASEANAI/CoEAI/AIAAIC, listed below
  # under `frameworks:`) hold semicolon-separated term ids. Tool mappings
  # live in the separate `tool_map` tab, not here.
  #
  # `datetime_added`/`datetime_checked`/`datetime_updated` (present on every
  # OUR tab below -- mapping, tool_map, tools, tool_metadata, terms,
  # framework) are freshness bookkeeping, not build inputs: when a row was
  # first added, when it was last reviewed for staleness, and when its
  # content last actually changed (a review that confirms nothing changed
  # updates only `datetime_checked`). `tools` and `tool_metadata` carry
  # independent freshness -- curation activity vs. collection activity,
  # never merged (see `tools:` columns below). Not yet used by any build
  # logic or rendered on the site -- currently just carried through into
  # data.json so a future scheduler/crawler can read them to decide what
  # needs re-fetching. Blank
  # is valid (older rows predate the columns).
  mapping:
    rq_no: "rq_no"
    datetime_added: "datetime_added"
    datetime_checked: "datetime_checked"
    datetime_updated: "datetime_updated"
  # Our tool_map tab: one row per (rq_no, tool_id, role) pairing. `role` must
  # be exactly "implement" or "eval" (case-sensitive) -- anything else is a
  # build warning and the row is skipped. `tool_id` must match an `id` in
  # the tools tab. `rationale` is free text and optional (renders as a
  # caption under the tool on the question's page when present).
  tool_map:
    rq_no: "rq_no"
    tool_id: "tool_id"
    role: "role"
    rationale: "rationale"
    datetime_added: "datetime_added"
    datetime_checked: "datetime_checked"
    datetime_updated: "datetime_updated"
  # Identity columns (id/tool_type/summary/source) are always sourced from
  # here, full stop -- no tool_metadata counterpart, no precedence logic.
  # `name`, `license`, `documentation`, and `homepage` look like identity
  # fields too but aren't treated as ones -- all four are auto-collectible
  # (GitHub repo API for name/license/homepage, pyproject.toml/package.json/
  # Cargo.toml for documentation/homepage), so they go through the
  # precedence rule below like every other tool_metadata column.
  #
  # Every OTHER column below (programming_language through
  # openssf_scorecard_vulnerabilities) also exists in `tool_metadata`
  # (config.data.tool_metadata, a separate spreadsheet), which
  # collect_project_metadata.py writes to. Same column name in both tabs;
  # build.py resolves ONE final value per field per tool, per this rule
  # (see resolve_metadata_field() in build.py for the exact logic):
  #
  #   - a non-blank cell HERE (in `tools`) always wins, as a human override
  #   - the literal text "none" (case-insensitive) HERE means "reviewed,
  #     deliberately blank" -- suppresses the tool_metadata value instead
  #     of falling through to it. A plain empty cell is NOT the same thing:
  #     it means "never reviewed" and falls through as normal.
  #   - otherwise, tool_metadata's collected value is used
  #
  # This is what makes `tool_metadata` 100% safe to bulk-overwrite on every
  # automated collection run -- no hand edit ever lives there; every
  # override, for any field, always goes here in `tools` instead.
  # `dependents` is the one field with nothing to fall through to
  # (never auto-collected, no public API for GitHub's dependency-graph
  # count) -- same column, same override mechanism, just always resolves
  # to whatever's here since tool_metadata's side is always blank.
  tools:
    id: "id"
    tool_type: "tool_type"
    name: "name"
    summary: "summary"
    license: "license"
    homepage: "homepage"
    source: "source"
    documentation: "documentation"
    programming_language: "programming_language"
    funding: "funding"
    funder: "funder"
    stars: "stars"
    forks: "forks"
    watchers: "watchers"
    contributors: "contributors"
    open_issues_count: "open_issues_count"
    releases_count: "releases_count"
    latest_release_date: "latest_release_date"
    last_commit_date: "last_commit_date"
    readme_url: "readme_url"
    license_url: "license_url"
    code_of_conduct_url: "code_of_conduct_url"
    contributing_url: "contributing_url"
    security_policy_url: "security_policy_url"
    governance_url: "governance_url"
    sbom_url: "sbom_url"
    dependents: "dependents"
    development_status: "development_status"
    paper_url: "paper_url"
    software_heritage_id: "software_heritage_id"
    openssf_best_practices_url: "openssf_best_practices_url"
    openssf_best_practices_badge_level: "openssf_best_practices_badge_level"
    openssf_scorecard_url: "openssf_scorecard_url"
    openssf_scorecard_score: "openssf_scorecard_score"
    # Individual OpenSSF Scorecard check scores (0-10; -1 means Scorecard
    # could not evaluate that check, not a real score -- see
    # collect_project_metadata.py's docstring).
    openssf_scorecard_branch_protection: "openssf_scorecard_branch_protection"
    openssf_scorecard_code_review: "openssf_scorecard_code_review"
    openssf_scorecard_maintained: "openssf_scorecard_maintained"
    openssf_scorecard_vulnerabilities: "openssf_scorecard_vulnerabilities"
    # GitHub repo topics unioned with package-manifest `keywords` fields
    # (semicolon list); active GitHub Sponsors count for the repo owner, via
    # sponsors.ecosyste.ms -- see collect_project_metadata.py's docstring.
    keywords: "keywords"
    sponsors: "sponsors"
    datetime_added: "datetime_added"
    datetime_checked: "datetime_checked"
    datetime_updated: "datetime_updated"
  # Machine-written by curation/collect_project_metadata.py, one row per
  # tool id -- see the big comment on `tools` above for the precedence
  # rule. `name`/`source` are read-only reference columns for a human
  # skimming this sheet (build.py ignores them, identity always comes from
  # `tools`); every other column name matches `tools`' own exactly.
  tool_metadata:
    id: "id"
    name: "name"
    source: "source"
    license: "license"
    programming_language: "programming_language"
    documentation: "documentation"
    homepage: "homepage"
    funding: "funding"
    funder: "funder"
    stars: "stars"
    forks: "forks"
    watchers: "watchers"
    contributors: "contributors"
    open_issues_count: "open_issues_count"
    releases_count: "releases_count"
    latest_release_date: "latest_release_date"
    last_commit_date: "last_commit_date"
    readme_url: "readme_url"
    license_url: "license_url"
    code_of_conduct_url: "code_of_conduct_url"
    contributing_url: "contributing_url"
    security_policy_url: "security_policy_url"
    governance_url: "governance_url"
    sbom_url: "sbom_url"
    development_status: "development_status"
    paper_url: "paper_url"
    software_heritage_id: "software_heritage_id"
    openssf_best_practices_url: "openssf_best_practices_url"
    openssf_best_practices_badge_level: "openssf_best_practices_badge_level"
    openssf_scorecard_url: "openssf_scorecard_url"
    openssf_scorecard_score: "openssf_scorecard_score"
    openssf_scorecard_branch_protection: "openssf_scorecard_branch_protection"
    openssf_scorecard_code_review: "openssf_scorecard_code_review"
    openssf_scorecard_maintained: "openssf_scorecard_maintained"
    openssf_scorecard_vulnerabilities: "openssf_scorecard_vulnerabilities"
    keywords: "keywords"
    sponsors: "sponsors"
    datetime_added: "datetime_added"
    datetime_checked: "datetime_checked"
    datetime_updated: "datetime_updated"
  # Shared term catalog across all frameworks listed in `frameworks:` below.
  # `id` is a globally unique, namespaced identifier (e.g. `euaiact-a8`,
  # `coeai-a8`, `rgaf-safe`, `aiaaic-humanrights`) -- see README for the
  # namespacing convention. `framework_id` must be one of the `key` values in
  # the `frameworks:` list below (and match a row in the `framework` tab).
  terms:
    id: "id"
    framework: "framework_id"
    name: "name"
    summary: "summary"
    url: "url"
    datetime_added: "datetime_added"
    datetime_checked: "datetime_checked"
    datetime_updated: "datetime_updated"
  # Descriptive metadata about each framework/regulation itself, one row per
  # `key` in `frameworks:` below. Purely informational -- `label`/`doc_url`
  # in the merged framework_defs are derived from this tab's `name`/`source`
  # (falling back to `homepage`), not hardcoded here.
  framework:
    id: "id"
    name: "name"
    fullname: "fullname"
    summary: "summary"
    homepage: "homepage"
    source: "source"
    group: "group"
    datetime_added: "datetime_added"
    datetime_checked: "datetime_checked"
    datetime_updated: "datetime_updated"

# --- Framework / regulation mapping columns ---------------------------------
# `key` matches both the `framework_id` column values in the terms tab and
# the `id` column in the `framework` tab. `column` must match the mapping-tab
# header (semicolon-separated term ids). List order controls display/filter
# order everywhere on the site.
#
# `label` and `doc_url` are NOT set here -- they come from the `framework`
# tab at build time (`label` = its `name` column; `doc_url` = its `source`
# column, falling back to `homepage` if `source` is blank). `doc_url` is the
# FALLBACK source-document link used only when a specific term's own `url`
# (in the terms tab) is blank.
frameworks:
  - key: rgaf
    column: "rgaf"
  - key: aiaaic
    column: "aiaaic"
  - key: unescoai
    column: "unescoai"
  - key: aseanai
    column: "aseanai"
  - key: coeai
    column: "coeai"
  - key: euaiact
    column: "euaiact"

# --- Relevant expertise (a filter facet, sourced from the TAIG sheet) -------
# Rendered as chips and offered as a filter, reusing the framework machinery,
# but styled distinctly since it is not a principle/regulation.
expertise:
  key: expertise
  label: "Relevant expertise"

# --- Taxonomy (used for grouping on the main page) --------------------------
# Values must match those used in the TAIG sheet's Capacity / Target(s)
# columns. Ordering here controls section order on the home page; anything
# not listed is appended after, with `uncategorized_label` always last.
taxonomy:
  capacities:
    - "Assessment"
    - "Access"
    - "Verification"
    - "Security"
    - "Operationalisation"
    - "Ecosystem Monitoring"
  # One-line descriptions shown under each capacity's label on the Landscape
  # overview matrix. Purely cosmetic -- a capacity missing here just renders
  # without a subtitle, no build logic depends on this map being complete.
  capacity_blurbs:
    "Assessment": "Evaluating the capabilities and risks of an AI system."
    "Access": "Enabling researchers and auditors to interact with a system, its data, or its compute."
    "Verification": "Checking claims about how a system was built and how it behaves."
    "Security": "Protecting a system's components from unauthorised access or tampering."
    "Operationalisation": "Turning governance goals into concrete practice."
    "Ecosystem Monitoring": "Tracking the wider AI landscape and its downstream impacts."
  targets:
    - "Data"
    - "Compute"
    - "Model & Algorithms"
    - "Deployment"
    - "All"
  uncategorized_label: "Uncategorized"
