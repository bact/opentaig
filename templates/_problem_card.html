<article class="problem-card"
  data-capacity="{{ p.capacity }}"
  data-target="{{ p.target }}"
  data-has-tool="{{ '1' if p.tools else '0' }}"
  data-search="{{ (p.question ~ ' ' ~ (p.mappings.values() | sum(start=[]) | join(' ')) ~ ' ' ~ (p.tools | map(attribute='name') | join(' ')))|lower }}"
  {% for fw in frameworks %}
  data-fw-{{ fw.key }}="|{{ p.mappings.get(fw.key, []) | join('|') }}|"
  {% endfor %}
>
  <h4 class="problem-question"><a href="{{ root }}problems/{{ p.slug }}.html">{{ p.question }}</a></h4>
  <div class="chip-row">
    {% for fw in frameworks %}
      {% for term in p.mappings.get(fw.key, []) %}
      <a class="chip chip-{{ fw.key }}" href="{{ root }}frameworks/{{ fw.key }}/{{ term_slugs.get(fw.key, {}).get(term, '') }}.html" title="{{ fw.label }}">{{ term }}</a>
      {% endfor %}
    {% endfor %}
  </div>
  {% if p.tools %}
  <div class="tool-row">
    <span class="tool-row-label">Tools:</span>
    {% for t in p.tools %}
    <a class="tool-link" href="{{ root }}tools/{{ t.slug }}.html">{{ t.name }}</a>{{ ", " if not loop.last }}
    {% endfor %}
  </div>
  {% endif %}
</article>
