{% extends "base.html" %}
{% block title %}References — {{ site.title }}{% endblock %}
{% block content %}
<section class="page-hero">
  <div class="eyebrow">Sources</div>
  <h1>References</h1>
</section>
<ul class="citation-list">
  {% for ref in references %}
  <li><a href="{{ ref.url }}">{{ ref.citation }}</a></li>
  {% endfor %}
</ul>
{% endblock %}
