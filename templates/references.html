{% extends "base.html" %}
{% block title %}References — {{ site.title }}{% endblock %}
{% block content %}
<section class="page-hero">
  <div class="eyebrow">Sources</div>
  <h1>References</h1>
</section>
<ul class="citation-list">
  {% for ref in references %}
  {% if ref.lead %}
  <li>{{ ref.lead }}. <a href="{{ ref.url }}">{{ ref.title }}.</a></li>
  {% else %}
  <li><a href="{{ ref.url }}">{{ ref.title }}.</a></li>
  {% endif %}
  {% endfor %}
</ul>
{% endblock %}
