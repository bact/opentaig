<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }} — {{ site.tagline }}{% endblock %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="stylesheet" href="{{ root }}assets/style.css">
</head>
<body data-fw-keys="{{ frameworks | map(attribute='key') | join(',') }}">
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ root }}">
      <span class="brand-title{{ ' visually-hidden' if active == 'landscape' else '' }}">{{ site.title }}</span>
      <span class="brand-tagline{{ ' visually-hidden' if active == 'landscape' else '' }}">{{ site.tagline }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ root }}" class="{{ 'active' if active == 'landscape' else '' }}" title="Landscape overview" {{ 'aria-current="page"' | safe if active == 'landscape' else '' }}>Landscape</a>
      <a href="{{ root }}problems/" class="{{ 'active' if active == 'problems' or active == 'problem' else '' }}" title="Problems - mapped to tools" {{ 'aria-current="page"' | safe if active == 'problems' or active == 'problem' else '' }}>Problems</a>
      <a href="{{ root }}tools/" class="{{ 'active' if active == 'tools' else '' }}" title="Tools - mapped to problems" {{ 'aria-current="page"' | safe if active == 'tools' else '' }}>Tools</a>
      <a href="{{ root }}frameworks/" class="{{ 'active' if active == 'frameworks' else '' }}" title="Frameworks and regulations" {{ 'aria-current="page"' | safe if active == 'frameworks' else '' }}>Frameworks</a>
      <a href="{{ root }}references/" class="{{ 'active' if active == 'references' else '' }}" {{ 'aria-current="page"' | safe if active == 'references' else '' }}>References</a>
      <a href="{{ site.repo_url }}" title="Source code repository">GitHub ↗</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main-content" tabindex="-1">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>
      {{ problem_count }} open problems &middot; {{ tool_count }} open-source tools &middot;
      generated {{ generated_at }}
    </p>
  </div>
</footer>
<script src="{{ root }}assets/app.js"></script>
</body>
</html>
